<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>サイト管理</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f6fde; --ok: #1f9d55; --warn: #c27c0e; --bad: #d23c3c;
    --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --card: #1d2129; --text: #e7eaf0; --muted: #98a0b1; --line: #2c313b;
      --accent: #6c9cff; --ok: #4cc485; --warn: #e2a84a; --bad: #f07070; --chip: #272c36;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=search] { flex: 1; min-width: 180px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); border-radius: 8px; padding: 6px 10px; font: inherit; }
  .list { display: grid; gap: 10px; }
  .site { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .top h2 { font-size: 16px; margin: 0; }
  .top h2 a { color: inherit; text-decoration: none; }
  .top h2 a:hover { color: var(--accent); text-decoration: underline; }
  .chip { background: var(--chip); border-radius: 6px; padding: 0 7px; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .meta a { color: var(--accent); word-break: break-all; }
  .notes { font-size: 13px; margin-top: 6px; }
  .notes.warn { color: var(--warn); }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .check { color: var(--muted); font-size: 12px; margin-top: 18px; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>サイト管理</h1>
  <p class="sub">youki29.github.io 配下の勉強サイトとアプリ用ページの一覧。元データは <code>sites.js</code>。</p>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <div class="tabs" id="cats"></div>
  </div>
  <div class="bar">
    <div class="tabs" id="subjects"></div>
    <input type="search" id="q" placeholder="タイトル・メモで検索">
  </div>

  <div class="list" id="list"></div>
  <p class="check" id="check"></p>
</div>

<script src="sites.js"></script>
<script src="check-result.js" onerror="void 0"></script>
<script>
const SITES = window.SITES || [];
const CHECK = window.CHECK_RESULT || null;
const CAT_LABEL = { study: "勉強", app: "アプリ", other: "その他" };
const VIS_LABEL = { listed: "トップに掲載", unlisted: "URL のみ", noindex: "検索除外" };
const ST_LABEL = { live: "公開中", draft: "作成中", archived: "公開終了" };
const state = { cat: "study", subject: "すべて", q: "" };

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function tabs(container, values, current, onPick) {
  container.replaceChildren(...values.map(v => {
    const b = el("button", { class: v.key === current ? "on" : "" }, v.label);
    b.onclick = () => onPick(v.key);
    return b;
  }));
}

function render() {
  const study = SITES.filter(s => s.category === "study");
  const live = SITES.filter(s => s.status === "live");
  const noSource = study.filter(s => !s.source);
  const down = CHECK ? Object.values(CHECK.results).filter(r => r.code !== 200).length : null;
  document.getElementById("stats").replaceChildren(
    ...[[SITES.length, "全サイト"], [study.length, "勉強サイト"], [live.length, "公開中"],
        [noSource.length, "ローカル元ファイルなし"], [down == null ? "—" : down, "表示できないURL"]]
      .map(([n, l]) => el("div", { class: "stat" }, el("b", {}, String(n)), el("span", {}, l))));

  const cats = [{ key: "all", label: "すべて" },
    ...Object.entries(CAT_LABEL).filter(([k]) => SITES.some(s => s.category === k)).map(([k, l]) => ({ key: k, label: l }))];
  tabs(document.getElementById("cats"), cats, state.cat, k => { state.cat = k; state.subject = "すべて"; render(); });

  const inCat = SITES.filter(s => state.cat === "all" || s.category === state.cat);
  const subjects = ["すべて", ...new Set(inCat.map(s => s.subject).filter(Boolean))];
  tabs(document.getElementById("subjects"), subjects.map(s => ({ key: s, label: s })), state.subject,
    k => { state.subject = k; render(); });

  const q = state.q.trim().toLowerCase();
  const shown = inCat
    .filter(s => state.subject === "すべて" || s.subject === state.subject)
    .filter(s => !q || [s.title, s.notes, s.subject, s.kind, s.url].join(" ").toLowerCase().includes(q))
    .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));

  const list = document.getElementById("list");
  if (!shown.length) { list.replaceChildren(el("div", { class: "empty" }, "該当するサイトはありません")); }
  else list.replaceChildren(...shown.map(card));

  document.getElementById("check").textContent = CHECK
    ? `最終チェック：${CHECK.checked_at}（python3 tools/check_sites.py で更新）`
    : "まだチェックしていません。python3 tools/check_sites.py を実行すると各URLの表示可否が出ます。";
}

function card(s) {
  const r = CHECK && CHECK.results[s.id];
  const dot = el("span", { class: "dot" + (r ? (r.code === 200 ? " ok" : " bad") : ""),
    title: r ? `HTTP ${r.code}` : "未チェック" });
  const top = el("div", { class: "top" },
    el("h2", {}, dot, el("a", { href: s.url, target: "_blank", rel: "noopener" }, s.title)),
    s.subject ? el("span", { class: "chip" }, s.subject) : null,
    s.kind ? el("span", { class: "chip" }, s.kind) : null,
    el("span", { class: "chip" }, VIS_LABEL[s.visibility] || s.visibility),
    s.status !== "live" ? el("span", { class: "chip" }, ST_LABEL[s.status] || s.status) : null);
  const meta = el("div", { class: "meta" },
    el("a", { href: s.url, target: "_blank", rel: "noopener" }, s.url.replace("https://", "")),
    s.repo ? el("a", { href: "https://github.com/" + s.repo, target: "_blank", rel: "noopener" }, "GitHub: " + s.repo) : null,
    el("span", {}, "元ファイル：" + (s.source || "なし")),
    s.preview ? el("span", {}, "プレビュー：" + s.preview) : null,
    el("span", {}, "更新 " + (s.updated || "—")));
  const warn = /要|なし|未確認|重複|見当たらない/.test(s.notes || "");
  return el("div", { class: "site" }, top, meta,
    s.notes ? el("div", { class: "notes" + (warn ? " warn" : "") }, s.notes) : null,
    r && r.code !== 200 ? el("div", { class: "notes warn" }, `表示できません（HTTP ${r.code}）`) : null);
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
render();
</script>
</body>
</html>
